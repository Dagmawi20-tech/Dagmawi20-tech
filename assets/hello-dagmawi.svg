<svg xmlns="http://www.w3.org/2000/svg" width="850" height="210" viewBox="0 0 850 210" role="img" aria-labelledby="title desc">
  <title id="title">Hey, I am Dagmawi</title>
  <desc id="desc">A terminal-inspired greeting reveals Dagmawi's name in mint and violet, with an orbiting spark and blinking cursor.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#66f0c2"/><stop offset="1" stop-color="#b49aff"/></linearGradient>
    <clipPath id="reveal"><rect x="65" y="70" width="710" height="75"><animate attributeName="width" values="0;0;710;710;0" keyTimes="0;.08;.38;.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect x="1" y="1" width="848" height="208" rx="20" fill="#0d1117" stroke="#30363d"/>
  <circle cx="27" cy="25" r="4" fill="#ff7b72"/><circle cx="43" cy="25" r="4" fill="#e3b341"/><circle cx="59" cy="25" r="4" fill="#66f0c2"/>
  <text x="80" y="29" fill="#8b949e" font-family="monospace" font-size="12">dagmawi / hello.world</text>
  <path d="M25 47H825" stroke="#21262d"/>
  <text x="28" y="121" fill="#66f0c2" font-family="monospace" font-size="30">&gt;</text>
  <g clip-path="url(#reveal)"><text x="65" y="124" fill="url(#ink)" font-family="monospace" font-size="46" font-weight="700" letter-spacing="-1">Hey, I am Dagmawi</text></g>
  <rect x="65" y="85" width="3" height="45" rx="1" fill="#66f0c2">
    <animate attributeName="x" values="65;65;510;510;65" keyTimes="0;.08;.38;.92;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="65" y="167" fill="#8b949e" font-family="monospace" font-size="14">build. learn. repeat.</text>
  <g transform="translate(730 111)">
    <ellipse rx="48" ry="20" fill="none" stroke="#30363d" transform="rotate(-35)"/>
    <ellipse rx="48" ry="20" fill="none" stroke="#30363d" transform="rotate(35)"/>
    <text text-anchor="middle" y="7" fill="#b49aff" font-family="monospace" font-size="22">{ }</text>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/><circle cx="48" r="4" fill="#66f0c2"/></g>
  </g>
</svg>
